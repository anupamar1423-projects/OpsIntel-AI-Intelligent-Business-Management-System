{% extends "base.html" %}{% block title %}Create account | OpsIntel AI{% endblock %}{% block content %}<div class="login"><h1>Create account</h1><p>Create a workspace or join one with an organization invite code.</p><form method="post">{% csrf_token %}<label class="form-label">Your name / username</label><input class="form-control mb-3" name="username" autocomplete="username" required><label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" autocomplete="email" required><label class="form-label">New organization name</label><input class="form-control mb-3" name="organization" placeholder="Required only when creating an organization"><label class="form-label">Join organization with invite code (optional)</label><input class="form-control mb-3" name="invite_code" placeholder="UUID from your organization admin"><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" autocomplete="new-password" minlength="8" required><label class="form-label">Confirm password</label><input class="form-control mb-3" type="password" name="confirm_password" autocomplete="new-password" required><button class="btn btn-primary w-100">Create account</button></form><p class="mt-3 mb-0">Already registered? <a href="/accounts/login/">Sign in</a>.</p></div>{% endblock %}
